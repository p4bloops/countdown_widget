name: CountdownWidget
options:
  bundleIdPrefix: com.pablogv
  developmentLanguage: es
  deploymentTarget:
    iOS: "17.0"
settings:
  base:
    SWIFT_VERSION: "5.9"
    MARKETING_VERSION: "1.0"
    CURRENT_PROJECT_VERSION: "1"

targets:
  CountdownWidget:
    type: application
    platform: iOS
    sources: [App, Shared]
    dependencies:
      - target: CountdownWidgetExtension
    entitlements:
      path: App/App.entitlements
      properties:
        com.apple.security.application-groups:
          - group.com.pablogv.countdown
    info:
      path: App/Info.plist
      properties:
        CFBundleDisplayName: Cuenta atrás
        CFBundleLocalizations: [es, en]
        UILaunchScreen: {}
        UISupportedInterfaceOrientations:
          - UIInterfaceOrientationPortrait
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.pablogv.countdown

  CountdownWidgetExtension:
    type: app-extension
    platform: iOS
    sources: [Widget, Shared]
    entitlements:
      path: Widget/Widget.entitlements
      properties:
        com.apple.security.application-groups:
          - group.com.pablogv.countdown
    info:
      path: Widget/Info.plist
      properties:
        CFBundleDisplayName: Cuenta atrás
        CFBundleLocalizations: [es, en]
        NSExtension:
          NSExtensionPointIdentifier: com.apple.widgetkit-extension
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.pablogv.countdown.widget
