name: Build IPA (sin firmar)

on:
  workflow_dispatch:
  push:
    branches: [main]

jobs:
  build:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4

      - name: Instalar herramientas
        run: brew install xcodegen ldid

      - name: Generar proyecto Xcode
        run: xcodegen generate

      - name: Compilar (sin firmar)
        run: |
          xcodebuild \
            -project CountdownWidget.xcodeproj \
            -scheme CountdownWidget \
            -configuration Release \
            -sdk iphoneos \
            -destination 'generic/platform=iOS' \
            -derivedDataPath build \
            CODE_SIGNING_ALLOWED=NO CODE_SIGNING_REQUIRED=NO CODE_SIGN_IDENTITY="" \
            build

      - name: Empaquetar .ipa
        run: |
          APP=build/Build/Products/Release-iphoneos/CountdownWidget.app
          # Incrusta los entitlements (App Group) para que el firmador (AltStore/Sideloadly) los vea
          ldid -SApp/App.entitlements "$APP/CountdownWidget"
          ldid -SWidget/Widget.entitlements "$APP/PlugIns/CountdownWidgetExtension.appex/CountdownWidgetExtension"
          mkdir Payload
          cp -r "$APP" Payload/
          zip -qr CountdownWidget.ipa Payload

      - uses: actions/upload-artifact@v4
        with:
          name: CountdownWidget-ipa
          path: CountdownWidget.ipa
